name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
        env:
          # Deterministic placeholder for e2e - the assistant tests mock the
          # /chat endpoint and the /ws/voice socket, so neither needs to
          # resolve to a real backend.
          PUBLIC_ASSISTANT_API_URL: https://example.invalid
          PUBLIC_ASSISTANT_VOICE_URL: wss://example.invalid/ws/voice
      - name: Test network interactions
        run: npm run test:e2e

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Install, build, and upload
        uses: withastro/action@v3
        with:
          # scripts/export-bio-data.ts runs via plain `node` and relies on
          # Node's built-in TypeScript support, which this action's default
          # runtime (Node 20) doesn't have; match the `test` job's version.
          node-version: 22
        env:
          PUBLIC_ASSISTANT_API_URL: ${{ vars.PUBLIC_ASSISTANT_API_URL }}
          PUBLIC_ASSISTANT_VOICE_URL: ${{ vars.PUBLIC_ASSISTANT_VOICE_URL }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
